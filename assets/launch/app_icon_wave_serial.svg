<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 纯色背景：Flutter 蓝 -->
  <rect x="64" y="64" width="896" height="896" rx="192" ry="192" fill="#02569B"/>

  <!-- 主波形线：较细白色曲线 -->
  <polyline points="180 512 320 368 460 656 600 448 740 552 880 392"
            fill="none" stroke="#FFFFFF" stroke-width="56"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右下角圆滑 DB9 端口（放大） -->
  <!-- 外壳 -->
  <rect x="680" y="700" width="200" height="140" rx="40" ry="40" fill="#93C5FD"/>
  <!-- 插口 -->
  <rect x="720" y="735" width="120" height="75" rx="20" ry="20" fill="#02569B"/>
  <!-- 上排 5 针 -->
  <circle cx="740" cy="757" r="10" fill="#93C5FD"/>
  <circle cx="760" cy="757" r="10" fill="#93C5FD"/>
  <circle cx="780" cy="757" r="10" fill="#93C5FD"/>
  <circle cx="800" cy="757" r="10" fill="#93C5FD"/>
  <circle cx="820" cy="757" r="10" fill="#93C5FD"/>
  <!-- 下排 4 针 -->
  <circle cx="750" cy="787" r="10" fill="#93C5FD"/>
  <circle cx="770" cy="787" r="10" fill="#93C5FD"/>
  <circle cx="790" cy="787" r="10" fill="#93C5FD"/>
  <circle cx="810" cy="787" r="10" fill="#93C5FD"/>
</svg>
