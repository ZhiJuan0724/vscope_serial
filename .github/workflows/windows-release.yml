name: Windows CI Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check UI consistency
        shell: pwsh
        run: ./tools/check_ui_consistency.ps1

      - name: Run tests
        run: flutter test

      - name: Test restricted pyOCD worker
        run: python -m unittest test_tools/test_pyocd_worker.py -v

      - name: Run native serial time tests
        shell: pwsh
        run: |
          cmake -S windows/native_serial_reader -B build/native_serial_tests -DBUILD_TESTING=ON
          cmake --build build/native_serial_tests --config Release --target native_serial_time_test
          ctest --test-dir build/native_serial_tests -C Release --output-on-failure

      - name: Verify plot rebuild isolation
        run: flutter test test/views/plot_page_rebuild_test.dart --dart-define=PLOT_PERF_METRICS=true

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Clean previous build outputs
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release tag version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch "^v\d+\.\d+\.\d+(-beta\.\d+)?$") {
            throw "Release tag must use vX.Y.Z or vX.Y.Z-beta.N: $tag"
          }
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern "^\s*version\s*:\s*(\S+)" | Select-Object -First 1).Matches.Groups[1].Value
          $tagVersion = $tag -replace "^v", ""
          if ($pubspecVersion -ne $tagVersion) {
            throw "pubspec.yaml version ($pubspecVersion) must match tag without v ($tagVersion)"
          }

      - name: Build Windows
        shell: pwsh
        run: |
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          flutter build windows --release "--dart-define=BUILD_TIME=$buildTime"

      - name: Test Windows crash dump handler
        shell: pwsh
        run: |
          $cacheLine = Select-String `
            -Path "build/windows/x64/CMakeCache.txt" `
            -Pattern "^CMAKE_COMMAND:INTERNAL=(.+)$" |
            Select-Object -First 1
          if ($null -eq $cacheLine) {
            throw "Unable to locate the CMake executable used by Flutter"
          }
          $cmake = $cacheLine.Matches.Groups[1].Value
          & $cmake `
            --build "build/windows/x64" `
            --config Release `
            --target crash_dump_handler_test
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build crash_dump_handler_test"
          }
          & "build/windows/x64/runner_tests/Release/crash_dump_handler_test.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Crash dump handler did not produce valid DMP and JSON files"
          }

      - name: Package Windows debug symbols
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $symbolRoot = "build/windows-symbols"
          if (Test-Path -LiteralPath $symbolRoot) {
            Remove-Item -LiteralPath $symbolRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $symbolRoot | Out-Null
          $pdbFiles = Get-ChildItem -LiteralPath $bundle -Recurse -File -Filter "*.pdb"
          if ($pdbFiles.Count -eq 0) {
            throw "Windows release build did not produce any PDB files"
          }
          foreach ($file in $pdbFiles) {
            $relative = [System.IO.Path]::GetRelativePath(
              (Resolve-Path -LiteralPath $bundle).Path,
              $file.FullName
            )
            $destination = Join-Path $symbolRoot $relative
            $destinationDirectory = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $destination
          }
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $version = "v0.0.0-${{ github.sha }}"
          }
          Compress-Archive `
            -Path "$symbolRoot/*" `
            -DestinationPath "build/vscope_serial-symbols-$version.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: vscope_serial-windows-symbols
          path: build/vscope_serial-symbols-*.zip
          if-no-files-found: error

      - name: Install third-party notices
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$bundle/THIRD_PARTY_NOTICES.md"

      - name: Install pinned OpenOCD runtime
        shell: pwsh
        run: |
          python tools/prepare_openocd_runtime.py `
            --bundle "build/windows/x64/runner/Release"

      - name: Verify native serial reader DLL
        shell: pwsh
        run: |
          $dll = "build/windows/x64/runner/Release/native_serial_reader.dll"
          if (-not (Test-Path $dll)) {
            throw "Missing native_serial_reader.dll in release bundle"
          }
          $updater = "build/windows/x64/runner/Release/vscope_updater.exe"
          if (-not (Test-Path $updater)) {
            throw "Missing vscope_updater.exe in release bundle"
          }
          $openOcdArchive = "build/windows/x64/runner/Release/runtime/openocd/openocd-runtime.zip"
          if (-not (Test-Path $openOcdArchive)) {
            throw "Missing bundled OpenOCD archive"
          }
          $openOcdManifest = "build/windows/x64/runner/Release/runtime/openocd/openocd-runtime.json"
          if (-not (Test-Path $openOcdManifest)) {
            throw "Missing bundled OpenOCD manifest"
          }

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $version = "v0.0.0-${{ github.sha }}"
          }
          if (Test-Path -LiteralPath "dist") {
            Remove-Item -LiteralPath "dist" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "dist" | Out-Null
          python tools/generate_update_assets.py `
            --bundle "build/windows/x64/runner/Release" `
            --tag $version `
            --output dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscope_serial-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: windows-latest
    needs: build-windows
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vscope_serial-windows
          path: dist

      - name: Download Windows debug symbols
        uses: actions/download-artifact@v4
        with:
          name: vscope_serial-windows-symbols
          path: symbols

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))(\s+-\s+.*)?\s*$") {
              $start = $i + 1
              break
            }
          }
          if ($start -lt 0) {
            throw "Missing CHANGELOG.md section for $tag"
          }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+v?\d+(\.\d+)+(-beta\.\d+)?") {
              $end = $i
              break
            }
          }
          $body = ($lines[$start..($end - 1)] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "Empty CHANGELOG.md section for $tag"
          }
          $body | Out-File -FilePath release_notes.md -Encoding utf8
          "body<<RELEASE_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          files: |
            dist/*.zip
            dist/update-manifest-*.json
            symbols/*.zip
          body_path: release_notes.md

      - name: Publish Gitee release
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: ZhiJuan0724
          gitee_repo: vscope_serial
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.ref_name }}
          gitee_release_name: ${{ github.ref_name }}
          gitee_release_body: ${{ steps.changelog.outputs.body }}
          gitee_target_commitish: ${{ github.sha }}
          gitee_upload_retry_times: 3
          gitee_files: |
            dist/*.zip
            dist/update-manifest-*.json
